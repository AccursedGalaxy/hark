<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>idea</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --sidebar: #111213;
        --border: #1f2123;
        --text: #e6e6e6;
        --muted: #8a8a8a;
        --accent-busy: #d97706;
        --accent-idle: #22c55e;
        --accent-dead: #4b5563;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: 100%;
      }
      aside {
        background: var(--sidebar);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      aside header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      aside header h1 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      aside header .count {
        font-size: 11px;
        color: var(--muted);
        background: #1a1c1e;
        padding: 2px 8px;
        border-radius: 10px;
      }
      #sessions {
        list-style: none;
        margin: 0;
        padding: 6px 0;
      }
      #sessions li {
        padding: 10px 16px;
        border-bottom: 1px solid #161718;
        cursor: default;
      }
      #sessions li:hover { background: #16181a; }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--accent-dead);
      }
      .dot.busy { background: var(--accent-busy); box-shadow: 0 0 6px var(--accent-busy); }
      .dot.idle { background: var(--accent-idle); }
      .title {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .kind {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .cwd {
        margin-top: 3px;
        font-size: 11px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        direction: rtl;
        text-align: left;
      }
      .empty {
        padding: 20px 16px;
        color: var(--muted);
        font-size: 12px;
      }
      main { background: var(--bg); }
    </style>
  </head>
  <body>
    <div id="app">
      <aside>
        <header>
          <h1>Claude sessions</h1>
          <span class="count" id="count">0</span>
        </header>
        <ul id="sessions"></ul>
      </aside>
      <main></main>
    </div>

    <script>
      const list = document.getElementById("sessions");
      const count = document.getElementById("count");

      function basename(p) {
        const parts = p.split("/").filter(Boolean);
        return parts[parts.length - 1] || p;
      }

      function render(sessions) {
        count.textContent = String(sessions.length);
        if (sessions.length === 0) {
          list.innerHTML = '<div class="empty">No active sessions</div>';
          return;
        }
        list.innerHTML = sessions
          .map((s) => {
            const title = s.name || basename(s.cwd);
            const status = s.status || "";
            return `
              <li>
                <div class="row">
                  <span class="dot ${status}"></span>
                  <span class="title">${escapeHtml(title)}</span>
                  <span class="kind">${escapeHtml(s.kind || "")}</span>
                </div>
                <div class="cwd" title="${escapeHtml(s.cwd)}">${escapeHtml(s.cwd)}</div>
              </li>
            `;
          })
          .join("");
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);
      }

      async function refresh() {
        try {
          const res = await fetch("/api/sessions");
          const { sessions } = await res.json();
          render(sessions);
        } catch (err) {
          console.error(err);
        }
      }

      refresh();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
